[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyone-assistant-backend"
version = "0.1.0"
description = "Backend do Assistente de Conhecimento Interno da Anyone Agro Business"
requires-python = ">=3.11"
dependencies = [
    "strands-agents==1.62.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "chromadb==1.5.9",
    "boto3==1.43.120",
    "python-dotenv==1.2.4",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.13",
    "ruff==0.17.3",
    "httpx==0.28.1",
]

[tool.setuptools]
py-modules = [
    "agent",
    "assistant_service",
    "bedrock_client",
    "chunking",
    "config",
    "dependencies",
    "errors",
    "ingest",
    "knowledge_store",
    "main",
    "rag",
    "schemas",
    "sessions",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "chroma_store"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "assistant_service",
    "bedrock_client",
    "chunking",
    "config",
    "dependencies",
    "errors",
    "ingest",
    "knowledge_store",
    "main",
    "rag",
    "schemas",
    "sessions",
    "strategies",
    "fakes",
]
